# EasyRAG 知识管理服务配置
#
# 凭据只从环境变量来，配置文件不入库（见仓库根 .gitignore /server/config/ 与 application-local.*）。
# 本地开发：先复制本文件为 application-local.yaml（被忽略），按需覆盖 .env 进不来的部分；
#   或直接通过环境变量注入。提交版本只保留无敏感值的默认。

server:
  port: 8080

spring:
  application:
    name: easyrag-server

  servlet:
    multipart:
      # 产品上限 1 MB 由 DocumentIntakeService 判定（A-3：响应含实际大小）。
      # 这里的 4 MB 是防滥用的服务端硬上限，高于产品上限一档，让正常的
      # 略超限请求都走业务层拿到准确提示；超过 4 MB 才由容器拒绝。
      # resolve-lazily 让超限异常在参数解析阶段抛出，能进入
      # @ExceptionHandler 映射成 400，而不是 multipart 预解析阶段裸抛 500。
      max-file-size: 4MB
      max-request-size: 4MB
      resolve-lazily: true

  datasource:
    # createDatabaseIfNotExist：库不存在时自动建，省掉 README 里一步手工 CREATE。
    # 注意它只建库不建表——表由 Flyway 迁移负责，两者缺一都会得到"能连上但没表"。
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:easyrag}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 库不可用时应用仍要能起（/health 如实报 DOWN），连接改为惰性建立。
      # 代价：首次真实 SQL 时才暴露连接失败——这正是健康检查要报告的状态。
      initialization-fail-timeout: -1
      connection-timeout: 3000
      maximum-pool-size: 10

  flyway:
    # 默认开启：数据权威层没有 schema 就不该算"起来了"。
    # 早先默认关过，结果是按 README 走一遍会得到"/health 报 db UP、
    # 但一张表都没建"——正是 pom 注释里记的那个假绿，默认配置自己会复现它。
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # 不用 schema.sql / data.sql 自动初始化，schema 全由 Flyway 管理
  sql:
    init:
      mode: never

rag:
  base-url: ${RAG_BASE_URL:http://localhost:8000}
  connect-timeout-ms: ${RAG_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${RAG_READ_TIMEOUT_MS:60000}
