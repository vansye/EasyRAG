name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: 前端工作台（Vue）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 装 Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 装依赖
        run: npm ci

      - name: 逻辑测试
        run: npm test

      - name: 类型检查与生产构建
        run: npm run build

  backend:
    name: 统一后端（FastAPI）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rag-service
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: easyrag_ci_only_password
    services:
      mysql:
        image: mysql:8.0.44
        # 容器仅用于 CI；root 让 fixture 创建并清理随机测试库。
        env:
          MYSQL_ROOT_PASSWORD: easyrag_ci_only_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - '127.0.0.1:3306:3306'
        options: >-
          --health-cmd="mysql --host=127.0.0.1 --user=root --password=easyrag_ci_only_password --execute='SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=30s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: rag-service/requirements.txt

      - name: 装依赖
        run: python -m pip install -r requirements.txt

      - name: 单元测试
        timeout-minutes: 10
        run: python -m pytest -q

      # 模型与 embedding 使用本地 fixture；数据库连接真实 MySQL。
      - name: MySQL 集成测试
        timeout-minutes: 10
        run: >-
          python -m pytest
          tests/mysql_schema_integration.py
          tests/mysql_knowledge_integration.py
          tests/mysql_recovery_integration.py
          tests/mysql_rebuild_integration.py
          tests/mysql_http_integration.py
          -q
