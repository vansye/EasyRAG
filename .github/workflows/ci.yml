name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: 知识管理服务（Spring Boot）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # 只跑单元测试：*IT 结尾的集成测试需要真实 MySQL 与本地凭据，
      # 由 Surefire 的 excludedGroups=requires-mysql 排除（见 server/pom.xml）。
      # 本地带库时用 ./mvnw verify 跑全套。
      - name: 单元测试
        working-directory: server
        run: ./mvnw -B test

  rag-service:
    name: RAG 引擎（FastAPI）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: 装依赖
        working-directory: rag-service
        run: python -m pip install -r requirements.txt

      # 测试不依赖 Ollama 在线：embedding 探针被打桩，
      # Chroma 用 tmp_path 隔离，环境变量在 fixture 里清空。
      - name: 测试
        working-directory: rag-service
        run: python -m pytest -q
